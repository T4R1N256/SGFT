name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgft
          POSTGRES_PASSWORD: sgft
          POSTGRES_DB: sgft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci-no-es-secreta
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://sgft:sgft@localhost:5432/sgft

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 1. El proyecto arranca (check)
        run: python manage.py check

      - name: 2. No falta ninguna migración
        run: python manage.py makemigrations --check --dry-run

      # Cobertura (WBS 4.1): las mismas pruebas, medidas con coverage, línea por línea y por rama. Las migraciones,
      # las pruebas y los puntos de entrada de wsgi/asgi no cuentan. coverage solo se instala aquí: no es
      # dependencia de la aplicación.
      - name: Instalar coverage
        run: pip install coverage==7.17.2

      - name: 3. Pruebas (con PostgreSQL) y cobertura
        run: >-
          coverage run --branch --source=apps,config
          --omit="*/migrations/*,*/tests*.py,config/wsgi.py,config/asgi.py"
          manage.py test

      # El resumen por archivo aparece en la pestaña del job; el reporte HTML queda como artefacto «cobertura-html».
      # Falla si la cobertura total baja de 90 %.
      - name: 3b. Resumen de cobertura
        run: |
          coverage report --skip-empty --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage html --skip-empty -d htmlcov
          coverage report --skip-empty --sort=cover --fail-under=90

      - name: Subir el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14

      - name: 4. Archivos en su lugar según el mapa de la skill
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" | python .claude/skills/sgft-organizacion-entregables/scripts/dueno_de_ruta.py --revisar

      # Paridad de precios: calcularTotal() de static/pos/pricing.js debe dar lo mismo que calcular_total()
      # para cada caso de tests_fixtures/pricing_cases.json (WBS 3.4.5). Node solo corre aquí, en el CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 5. Paridad de precios entre Python y JavaScript
        run: node --test "tests_e2e/parity/*.mjs"

      # Flujos críticos en un Chromium real contra el servidor de pruebas (WBS 3.4.8, 4.6): venta con y sin red,
      # apertura con PIN (en línea y con el verificador sin red) y cierre de caja, que se niega con pendientes.
      # Playwright solo se instala aquí: no es dependencia de la aplicación.
      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: 6. Pruebas E2E con Playwright
        env:
          SGFT_E2E: "1"
        run: python manage.py test tests_e2e
